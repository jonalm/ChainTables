# The determinism vector's cells (ADR-0022, #34 §4): Julia compat floor and latest,
# on every runner GitHub offers. test/model.jl asserts one literal state_fingerprint
# and test/ops.jl one literal transaction_hash
# in every cell; a red cell here is a chain break, not a flake.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']          # compat floor (Project.toml) and latest release
        os:
          - ubuntu-latest               # x86-64
          - ubuntu-24.04-arm            # aarch64
          - macos-15-intel              # x86-64
          - macos-latest                # aarch64
          - windows-latest              # x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  gateway:
    # The Python gateway (gateway/): unit tests over a stubbed S3, and the deployment zip
    # builds from the lock. No AWS identity is involved.
    name: Gateway (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: gateway/uv.lock
      - run: uv sync --directory gateway --frozen
      - run: uv run --directory gateway pytest
      - run: gateway/build.sh --arch arm64
      - run: bash -n gateway/deploy.sh && gateway/deploy.sh --help >/dev/null
