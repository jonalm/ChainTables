# The determinism vector's cells (ADR-0022, #34 §4): Julia compat floor and latest,
# on every runner GitHub offers. test/model.jl asserts one literal state_fingerprint
# in every cell; a red cell here is a chain break, not a flake.
name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']          # compat floor (Project.toml) and latest release
        os:
          - ubuntu-latest               # x86-64
          - ubuntu-24.04-arm            # aarch64
          - macos-15-intel              # x86-64
          - macos-latest                # aarch64
          - windows-latest              # x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
